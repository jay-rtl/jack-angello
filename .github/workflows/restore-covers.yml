name: Restore original-resolution book covers
on:
  push:
    paths:
      - .github/workflows/restore-covers.yml
      - .github/scripts/restore_cover_quality.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pillow
      - name: Find verified high-resolution versions
        run: python .github/scripts/restore_cover_quality.py
      - name: Commit improved matching cover images
        run: |
          if git diff --quiet -- assets/*.webp; then
            echo "No verified high-resolution matching covers were found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          git commit -m "Restore larger verified book-cover images"
          git push
