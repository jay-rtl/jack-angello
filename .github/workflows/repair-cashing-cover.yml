name: Repair Cashing In cover
on:
  push:
    paths:
      - .github/workflows/repair-cashing-cover.yml
      - .github/scripts/repair-cashing-cover.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pillow requests
      - name: Validate cover against user-supplied original in Git history
        run: python .github/scripts/repair-cashing-cover.py
      - name: Commit only corrected cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cashing-in-on-racial-color.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace gray catalog placeholder with authentic Cashing In cover"
          git push
