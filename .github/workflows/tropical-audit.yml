name: Tropical website visual audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tropical-audit.yml
      - .github/scripts/tropical-audit.cjs
      - assets/tropical.css
      - assets/books-tropical.css
      - assets/site.js
      - index.html
      - books/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static project at real Pages subpath
        run: |
          cd ..
          nohup python3 -m http.server 8765 > /tmp/island-audit-server.log 2>&1 &
      - name: Audit all routes and breakpoints
        run: node .github/scripts/tropical-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-asylum-responsive-screenshots
          path: screenshots/
          if-no-files-found: ignore
